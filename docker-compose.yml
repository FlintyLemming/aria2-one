services:
  aria2:
    image: flintylemming/aria2-one:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aria2-one
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "32516:32516"
      - "32516:32516/udp"
    environment:
      - PORT=8080
      - BTPORT=32516
      - USERNAME=admin
      - PASSWORD=admin888
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
      - CACHE=128M
      - UT=true
      - RUT=true
    volumes:
      - ./config:/config
      - ./downloads:/downloads
